 w=wk(ws),pw=wk(pws),ppw=wk(ppws),e=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6),f=function(d){return d.toLocaleDateString("id-ID",{day:"numeric",month:"short"})};
 $("wl").textContent=f(ws)+" – "+f(e);$("chart").innerHTML=chart(w,pw);
 var cw=ymd(ws)===ymd(mon(new Date()));
 $("r1").innerHTML=card(cw?"📋 REKAP MINGGU INI":"📋 REKAP MINGGU INI (TERPILIH)",w,pw);

route();setInterval(function(){if(!document.activeElement||document.activeElement.tagName!=="INPUT"){var y=window.scrollY;render();window.scrollTo(0,y)}},300000);
